<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradMask" cx="50%" cy="45%" r="65%" fx="50%" fy="35%">
      <stop offset="0%" stop-color="#2d1c13"/>
      <stop offset="60%" stop-color="#190e08"/>
      <stop offset="100%" stop-color="#0c0704"/>
    </radialGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cupGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#f5e6d3"/>
    </linearGradient>
    <linearGradient id="steamGradMask" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Centered content with 15% safe-zone margin -->
  <g transform="translate(256, 256) scale(0.72) translate(-256, -256)">
    <!-- Steaming curves -->
    <path d="M210 180 C 195 140, 230 115, 215 80" fill="none" stroke="url(#steamGradMask)" stroke-width="10" stroke-linecap="round"/>
    <path d="M256 165 C 240 120, 275 95, 256 60" fill="none" stroke="url(#steamGradMask)" stroke-width="12" stroke-linecap="round"/>
    <path d="M302 180 C 285 140, 320 115, 305 80" fill="none" stroke="url(#steamGradMask)" stroke-width="10" stroke-linecap="round"/>

    <!-- Coffee Cup Body -->
    <path d="M148 200 H364 C364 200 360 326 256 326 C152 326 148 200 148 200 Z" fill="url(#cupGradMask)"/>

    <!-- Cup Handle -->
    <path d="M352 220 H380 C406 220 416 238 416 260 C416 284 398 300 366 300 H342" fill="none" stroke="#f5e6d3" stroke-width="18" stroke-linecap="round"/>

    <!-- Coffee Saucer / Plate -->
    <ellipse cx="256" cy="350" rx="146" ry="18" fill="url(#goldGradMask)"/>
    <ellipse cx="256" cy="348" rx="138" ry="14" fill="#2d1c13"/>

    <!-- Coffee surface liquid inside cup -->
    <ellipse cx="256" cy="202" rx="104" ry="16" fill="#3b2011"/>
    <!-- Latte Art Heart -->
    <path d="M256 208 C250 200 236 198 236 203 C236 208 248 214 256 218 C264 214 276 208 276 203 C276 198 262 200 256 208 Z" fill="#fef3c7" opacity="0.9"/>

    <!-- CONTIGO text under the plate -->
    <text x="256" y="420" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="9" fill="url(#goldGradMask)" text-anchor="middle">CONTIGO</text>
    <text x="256" y="452" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#fbbf24" opacity="0.75" text-anchor="middle">COFFEE • SIDI BOUZID</text>
  </g>
</svg>
